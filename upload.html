<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparte tus fotos · Mile & Javier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#82836e;
    --cream:#e9e7df;
    --ink:#3c3b33;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    font-family:'EB Garamond', serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px;
    width:100%;
    background:#fff;
    border:1px solid rgba(130,131,110,0.35);
    border-radius:4px;
    padding:40px 32px;
    text-align:center;
  }
  h1{
    font-family:'Parisienne', cursive;
    font-size:2.6rem;
    color:var(--olive);
    margin:0 0 4px;
  }
  .eyebrow{
    font-family:'EB Garamond', serif;
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-size:0.75rem;
    color:var(--olive);
    margin-bottom:24px;
  }
  p.lead{
    font-size:1.05rem;
    line-height:1.5;
    margin-bottom:28px;
  }
  label{
    display:block;
    text-align:left;
    font-size:0.9rem;
    margin:16px 0 6px;
    color:var(--olive);
  }
  input[type="text"], textarea{
    width:100%;
    font-family:'EB Garamond', serif;
    font-size:1rem;
    padding:10px 12px;
    border:1px solid rgba(130,131,110,0.5);
    border-radius:3px;
    background:var(--cream);
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:70px;}
  .drop{
    margin-top:18px;
    border:1.5px dashed var(--olive);
    border-radius:4px;
    padding:26px 16px;
    cursor:pointer;
    background:var(--cream);
    transition:background .2s;
  }
  .drop:hover{background:#e0ded4;}
  .drop input{display:none;}
  .drop-text{font-size:0.95rem; color:var(--olive);}
  #preview{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
    justify-content:center;
  }
  #preview img{
    width:64px; height:64px; object-fit:cover;
    border-radius:3px; border:1px solid rgba(130,131,110,0.4);
  }
  button{
    margin-top:26px;
    width:100%;
    padding:13px;
    font-family:'EB Garamond', serif;
    font-size:1.05rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:var(--olive);
    color:#fff;
    border:none;
    border-radius:3px;
    cursor:pointer;
    transition:opacity .2s;
  }
  button:disabled{opacity:0.6; cursor:default;}
  #status{
    margin-top:16px;
    font-size:0.9rem;
    min-height:1.2em;
  }
  #status.ok{color:#4b6b3a;}
  #status.err{color:#a5453a;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Mile &amp; Javier · 12.09.2026</div>
    <h1>Comparte tus fotos</h1>
    <p class="lead">Ayúdanos a guardar los mejores momentos de nuestra boda. Sube las fotos que tomes durante la celebración — ¡todas suman!</p>

    <form id="uploadForm">
      <label for="name">Tu nombre (opcional)</label>
      <input type="text" id="name" placeholder="Ej: Familia Rodríguez">

      <label for="message">Un mensaje para los novios (opcional)</label>
      <textarea id="message" placeholder="Escribe unas palabras..."></textarea>

      <label>Fotos</label>
      <div class="drop" id="dropZone">
        <div class="drop-text">Toca para elegir fotos de tu galería o tomar una nueva</div>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>
      <div id="preview"></div>

      <button type="submit" id="submitBtn">Enviar fotos</button>
      <div id="status"></div>
    </form>
  </div>

<script>
// URL del Apps Script Web App (reemplaza tras el despliegue)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJ8GPlId9w27tC5pi5tFMResPhYFRStpLXrDUHO6AtIB_oQzLa8sI0NorcNvIwW4fZ_w/exec";

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const form = document.getElementById('uploadForm');
const submitBtn = document.getElementById('submitBtn');

let selectedFiles = [];

dropZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  selectedFiles = Array.from(fileInput.files);
  preview.innerHTML = '';
  selectedFiles.forEach(file => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  });
});

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(selectedFiles.length === 0){
    status.textContent = 'Elige al menos una foto.';
    status.className = 'err';
    return;
  }
  submitBtn.disabled = true;
  status.className = '';
  status.textContent = 'Enviando...';

  try{
    const name = document.getElementById('name').value;
    const message = document.getElementById('message').value;

    const filesPayload = await Promise.all(selectedFiles.map(async f => ({
      filename: f.name,
      mimeType: f.type,
      data: await fileToBase64(f)
    })));

    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ name, message, files: filesPayload })
    });

    status.textContent = '¡Gracias! Tus fotos fueron enviadas.';
    status.className = 'ok';
    form.reset();
    preview.innerHTML = '';
    selectedFiles = [];
  }catch(err){
    status.textContent = 'Hubo un error enviando las fotos. Intenta de nuevo.';
    status.className = 'err';
  }finally{
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
